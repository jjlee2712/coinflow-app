services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coinflow
      POSTGRES_PASSWORD: coinflow
      POSTGRES_DB: coinflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_URL: "postgres://coinflow:coinflow@db:5432/coinflow?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production"
    depends_on:
      db:
        condition: service_healthy
      